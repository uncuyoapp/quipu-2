name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Evitar deploys concurrentes
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (testing/mock data)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Se compila con --configuration testing para usar MockDataProvider (datos ficticios).
      # El --base-href es necesario porque GH Pages sirve desde /quipu-2/.
      - name: Build for GitHub Pages
        run: npx ng build --configuration testing --base-href /quipu-2/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/quipu/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
