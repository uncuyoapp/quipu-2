name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      # Tests preparados para activar cuando haya cobertura suficiente.
      # Descomentar las siguientes líneas cuando se implemente el suite de tests:
      #
      # - name: Run tests
      #   run: npm test -- --watch=false --browsers=ChromeHeadless
