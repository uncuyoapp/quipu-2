<div class="information-unit-selector">
  <h2>Seleccionar Unidad de Información</h2>
  <mat-radio-group [value]="selectedIU()">
    @for (unit of informationUnits(); track unit.id) {
    <mat-radio-button [value]="unit.id" (change)="onChange(unit)">
      <div class="unit-info">
        <p class="text-center">{{ unit.name }}</p>
        <img [src]="unit.logo" [alt]="unit.name" class="unit-logo" />
      </div>
    </mat-radio-button>
    }
  </mat-radio-group>
</div>
