@if (thematic()) {
<div class="thematic">
  <div class="container pb-4">
    <app-thematic-navigator [thematic]="thematic()!"
      (thematicSelected)="onSelectThematic($event)"></app-thematic-navigator>
    <hr class="d-md-none" />
  </div>

  @if (visualizations().length > 0) {

  <app-visualization-grid [visualizations]="visualizations()" [(filter)]="filter" [loading]="loading()"
    [(order)]="order" [actionButtonIcon]="icons.actions.add"
    [actionButtonLabel]="(editModeService.canEdit() && editModeService.isEditModeEnabled()) ? 'Asociar visualizaciones' : undefined"
    (actionButtonClick)="editVisualizations()"
    [visibleActions]="(editModeService.canEdit() && editModeService.isEditModeEnabled()) ? ['publish', 'unpublish', 'delete'] : []">
  </app-visualization-grid>

  } @else if (!loading()) {

  <div class="empty-state-container py-5">
    <div class="container">
      <div class="row mb-4">
        <div class="col-12 d-flex justify-content-between align-items-center">
          <app-alert-badge message="Temática sin visualizaciones asociadas" palette="alert"></app-alert-badge>
          @if (editModeService.canEdit() && editModeService.isEditModeEnabled()) {
          <app-button label="Asociar visualizaciones" variant="text" palette="blue" [icon]="icons.actions.add"
            (btnClick)="editVisualizations()"></app-button>
          }
        </div>
      </div>
      <div class="row align-items-center justify-content-center">
        <div class="col-12 col-md-5 col-lg-4 text-center">
          <img [src]="graphics.fallback" alt="No hay visualizaciones" class="img-fluid illustration mb-4 mb-md-0" />
        </div>
        <div class="col-12 col-md-7 col-lg-5 text-center text-md-start ps-md-5">
          <h3 class="mb-3">Lo sentimos</h3>
          <p class="q-text-muted mb-4">
            Esta temática no tiene visualizaciones asociadas aún. Vuelva a
            intentarlo más tarde o explore otras temáticas.
          </p>
          <div class="d-flex flex-wrap gap-3 justify-content-center justify-content-md-start">
            <app-button label="Ir al inicio" variant="primary" palette="blue" (btnClick)="goToHome()"></app-button>
          </div>
        </div>
      </div>
    </div>
  </div>
  }
</div>
}
