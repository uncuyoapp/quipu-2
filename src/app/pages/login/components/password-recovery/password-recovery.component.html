<div class="recovery-container d-flex flex-column h-100">
  <div class="recovery-content text-center my-auto">
    <p class="recovery-title mb-4">Recuperación de contraseña</p>

    <form name="recovery-password" (submit)="onSubmit()" [formGroup]="formRecovery">
      <div class="mb-4">
        <app-text-input [placeholder]="'Ingrese su email'" [type]="'text'"
          [initialValue]="formRecovery.get('email')?.value ?? ''" [validationState]="getEmailValidationState()"
          [errorMessage]="getEmailErrorMessage()" (valueChange)="onEmailChange($event)"
          (blurred)="onEmailBlur()"></app-text-input>
      </div>

      <div class="d-flex justify-content-center gap-3">
        <app-button variant="secondary" palette="gray" label="Volver" [icon]="icons.nav.back"
          (btnClick)="onGoBackClick()"></app-button>

        <app-button htmlType="submit" label="Enviar" [palette]="formRecovery.valid ? 'blue' : 'gray'"
          [variant]="formRecovery.valid ? 'primary' : 'secondary'" [disabled]="formRecovery.invalid"></app-button>
      </div>
    </form>
  </div>
</div>
