<div class="change-container d-flex flex-column h-100">
  <div class="change-content text-center my-auto">
    <p class="change-title mb-4">Reestablecer contraseña</p>

    <form name="psswh-password" [formGroup]="passwordChangeForm" (ngSubmit)="onSubmit()">
      <input type="hidden" formControlName="token" />

      <div class="mb-4">
        <app-text-input [placeholder]="'Ingrese la nueva contraseña'" [type]="'password'"
          [initialValue]="passwordChangeForm.get('password')?.value ?? ''"
          [validationState]="getPasswordValidationState()" [errorMessage]="getPasswordErrorMessage()"
          (valueChange)="onPasswordChange($event)" (blurred)="onPasswordBlur()"></app-text-input>
      </div>

      <div class="mb-5">
        <app-text-input [placeholder]="'Repita la nueva contraseña'" [type]="'password'"
          [initialValue]="passwordChangeForm.get('passwordRepeat')?.value ?? ''"
          [validationState]="getPasswordRepeatValidationState()" [errorMessage]="getPasswordRepeatErrorMessage()"
          (valueChange)="onPasswordRepeatChange($event)" (blurred)="onPasswordRepeatBlur()"></app-text-input>
      </div>

      <div class="d-flex justify-content-center gap-3">
        <app-button variant="secondary" palette="gray" label="Volver" [icon]="icons.nav.back"
          (btnClick)="onGoBackClick()"></app-button>

        <app-button htmlType="submit" label="Aceptar" [palette]="passwordChangeForm.valid ? 'blue' : 'gray'"
          [variant]="passwordChangeForm.valid ? 'primary' : 'secondary'"
          [disabled]="passwordChangeForm.invalid"></app-button>
      </div>
    </form>
  </div>
</div>
