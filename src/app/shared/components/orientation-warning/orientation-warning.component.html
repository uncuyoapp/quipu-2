@if (isMobile() && isPortrait() && rotationFailed()) {
  <div class="v-rotate-prompt">
    <div class="prompt-box">
      <ng-icon name="ionSyncOutline" size="64" class="sync-icon"></ng-icon>
      <h2>Gira tu dispositivo</h2>
      <p>Esta sección requiere formato horizontal para mostrarse correctamente.</p>
    </div>
  </div>
}
